# Application
app.url=https://opensource-demo.orangehrmlive.com
app.login.path=/web/index.php/auth/login
app.dashboard.path=/web/index.php/dashboard

# Browser
browser.name=chrome
browser.headless=true
browser.maximize=true
browser.timeout.implicit=10
browser.timeout.explicit=30
browser.timeout.page.load=30

# Test Data
test.data.valid.username=Admin
test.data.valid.password=admin123
test.data.invalid.username=nonexistent_user_xyz
test.data.invalid.password=WrongPass!
test.data.max.length.username=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@example.com

# Reporting
report.path=target/reports
screenshot.path=target/screenshots
screenshot.on.failure=true

# Retry
retry.count=1
